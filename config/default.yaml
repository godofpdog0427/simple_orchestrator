orchestrator:
  name: "simple-orchestrator"
  max_iterations: 20
  debug: false

llm:
  provider: "anthropic"
  anthropic:
    model: "claude-sonnet-4-20250514"
    max_tokens: 4096
    temperature: 0.7
    api_key_env: "ANTHROPIC_API_KEY"

hooks:
  enabled: true
  directories:
    - "./user_extensions/hooks"
  config_file: "./config/hooks.yaml"

tools:
  bash:
    enabled: true
    requires_approval: true
    timeout_seconds: 30
    max_output_length: 10000
    working_dir: "."
    blocked_commands:
      - "rm -rf /"
      - "mkfs"
      - "dd if=/dev/zero"
      - ":(){ :|:& };:"
      - "> /dev/sda"
    environment:
      TERM: "xterm-256color"
  
  file_read:
    enabled: true
    requires_approval: false
    max_file_size_mb: 10
  
  file_write:
    enabled: true
    requires_approval: true
  
  file_delete:
    enabled: true
    requires_approval: true

  todo_list:
    enabled: true
    requires_approval: false

  directories:
    - "./user_extensions/tools"

tasks:
  max_depth: 5
  autosave_interval: 60
  max_pending_tasks: 100

persistence:
  enabled: true
  state_file: "./.orchestrator/state.json"
  create_backups: true
  max_backups: 5
  autosave_interval: 30

logging:
  level: "INFO"
  file: "./.orchestrator/logs/orchestrator.log"
  console: true
  log_llm_calls: true
  log_tool_calls: true
  max_bytes: 10485760
  backup_count: 5

cli:
  theme: "monokai"
  use_rich: true
  show_progress: true
  history_file: "./.orchestrator/history"
  max_history_lines: 1000
